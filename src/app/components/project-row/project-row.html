<a [routerLink]="['/projets', project().slug]" class="project-row">
  <span class="project-year mono muted">{{ project().year }}</span>
  <div class="project-body">
    <h2 class="project-title">{{ project().title }}</h2>
    <p class="project-desc">{{ project().shortDescription }}</p>
    <span class="project-cta mono accent">Voir le projet →</span>
  </div>
  <p class="project-tech mono muted">{{ project().tech.join(' · ') }}</p>
</a>
